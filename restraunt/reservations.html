<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reserve a table at Food Delight for an unforgettable dining experience.">
    <title>Reservations - Food Delight</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url(restaurant2.jpg) no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
        }
        nav {
            background: rgba(10, 2, 65, 0.252);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
        }
        nav .logo {
            font-size: 36px;
            font-weight: bold;
            margin-left: 20px;
            color: #dfc76f;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fadeIn 1.5s ease-in-out;
            font-family: 'Brush Script MT', cursive;
        }
        nav a {
            color: #ffcc00;
            margin: 0 20px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: color 0.3s, transform 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        nav a:hover {
            color: #f4a261;
            transform: scale(1.1);
        }
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            animation: fadeIn 2s ease-in-out;
        }
        .hero h1 {
            font-size: 80px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 4px 4px 15px rgba(0,0,0,0.7);
            color: #ffcc00;
            font-family: 'Poppins', sans-serif;
        }
        .hero p {
            font-size: 24px;
            max-width: 700px;
            font-family: 'Poppins', sans-serif;
        }
        .reservation-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 50px;

        }
        .reservation-input {
            flex: 1 1 300px;
            padding: 15px;
            background: rgba(20, 228, 197, 0.256);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            text-align: center;
        }
        .reservation-input input, .reservation-input select, .reservation-input textarea {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            background: #053625b3;
            color: rgba(155, 148, 151, 0.941);
            outline: none;
        }
        .reservation-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6ae2d25e, #07c1d226);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 20px;
            border-radius: 10px;
            transition: background 0.3s, transform 0.2s;
        }
        .reservation-button:hover {
            background: linear-gradient(135deg, #28d3d66f, #0c90c5);
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Food Delight</div>
        <div>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="reservations.html">Reservations</a>
            <a href="events.html">Events</a>
            <a href="contact.html">Contact</a>
            <a href="about.html">About Us</a>
            <a href="gallery.html">Gallery</a>
            <a href="specials.html">Special Offers</a>
        </div>
    </nav>
    
    <div class="hero">
        <h1>Reserve Your Table</h1>
        <p>Book a table now and indulge in an exquisite dining experience at Food Delight.</p>
    </div>
    <form action="booking-confirmation.html" method="get">
        <div class="reservation-section">
            <div class="reservation-input">
                <input type="text" name="name" placeholder="Your Name" required>
            </div>
            <div class="reservation-input">
                <input type="email" name="email" placeholder="Your Email" required>
            </div>
            <div class="reservation-input">
                <input type="tel" name="phone" placeholder="Your Phone Number" required>
            </div>
            <div class="reservation-input">
                <input type="date" name="date" required>
            </div>
            <div class="reservation-input">
                <input type="time" name="time" required>
            </div>
            <div class="reservation-input">
                <select name="guests" required>
                    <option value="">Select Number of Guests</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6 or more</option>
                </select>
            </div>
            <div class="reservation-input">
                <textarea name="requests" placeholder="Special Requests (Optional)" rows="4"></textarea>
            </div>
            <div class="reservation-input">
                <button class="reservation-button" type="submit">Book Now</button>
            </div>
        </div>
    </form>
    
</body>
</html>
